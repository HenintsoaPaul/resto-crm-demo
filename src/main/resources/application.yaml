spring:
  application:
    name: resto-crm-demo
  datasource:
    url: jdbc:postgresql://${DB_URL:localhost:5432/resto_crm_demo}
    username: ${DB_USERNAME:resto_crm_demo}
    password: ${DB_PASSWORD:resto_crm_demo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7